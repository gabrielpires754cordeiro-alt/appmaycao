<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Maycão Gestão</title>
<meta name="description" content="Agenda, clientes, financeiro e estoque da Barbearia do Maycão.">
<meta name="theme-color" content="#A87622">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Maycão">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="../config.js"></script>
<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;padding:0}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<style>
/* Layout: app shell — sidebar no desktop, barra de abas inferior no celular; faixa de poste de barbeiro sob o cabeçalho */
:root{
  --bg:#EDF0F3; --surface:#FFFFFF; --surface-2:#F5F7F9; --ink:#16202B; --muted:#5B6978; --line:#D5DBE2;
  --accent:#A87622; --accent-soft:#F4E7CF; --accent-ink:#1B1406;
  --ok:#2C7A52; --ok-soft:#DDF0E5; --warn:#A8690F; --warn-soft:#FBEBD0; --bad:#B03434; --bad-soft:#F8DEDE;
  --info:#2F5E8C; --info-soft:#DCE7F2;
  --pole-red:#B03434; --pole-blue:#2F5E8C; --pole-white:#FFFFFF;
  --f-display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F151C; --surface:#17202A; --surface-2:#1D2833; --ink:#E7ECF1; --muted:#93A1AF; --line:#2A3644;
  --accent:#D3A24D; --accent-soft:#3A2E18; --accent-ink:#1B1406;
  --ok:#5FC08F; --ok-soft:#163327; --warn:#E3A44A; --warn-soft:#3A2A12; --bad:#E57373; --bad-soft:#3A1C1C;
  --info:#7FA9D6; --info-soft:#1A2B3D; --pole-white:#E7ECF1; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0F151C; --surface:#17202A; --surface-2:#1D2833; --ink:#E7ECF1; --muted:#93A1AF; --line:#2A3644;
  --accent:#D3A24D; --accent-soft:#3A2E18; --accent-ink:#1B1406;
  --ok:#5FC08F; --ok-soft:#163327; --warn:#E3A44A; --warn-soft:#3A2A12; --bad:#E57373; --bad-soft:#3A1C1C;
  --info:#7FA9D6; --info-soft:#1A2B3D; --pole-white:#E7ECF1; color-scheme:dark }
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-mono);font-size:.86em}

.app{display:grid;grid-template-columns:230px 1fr;min-height:100%}
.side{background:var(--surface);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px;gap:4px}
.brand{font-family:var(--f-display);font-weight:800;text-transform:uppercase;letter-spacing:.02em;font-size:26px;line-height:.95;margin:0 0 4px}
.brand small{display:block;font-family:var(--f-body);font-weight:600;font-size:11px;letter-spacing:.12em;color:var(--muted);margin-top:6px}
.pole{height:6px;border-radius:3px;margin:12px 0 18px;background:repeating-linear-gradient(-45deg,var(--pole-red) 0 8px,var(--pole-white) 8px 14px,var(--pole-blue) 14px 22px,var(--pole-white) 22px 28px);border:1px solid var(--line)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;border:0;background:none;padding:10px 12px;border-radius:8px;text-align:left;font-weight:600;color:var(--muted)}
.nav button svg{width:20px;height:20px;flex:none}
.nav button:hover{background:var(--surface-2);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--accent-soft);color:var(--ink)}
.nav button[aria-current="page"] svg{color:var(--accent)}
.side .foot{margin-top:auto;font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:8px}

main{min-width:0;padding-block:24px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.mtop{display:none}
.phead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--f-display);font-weight:800;text-transform:uppercase;font-size:clamp(30px,5vw,42px);line-height:.95;margin:0;letter-spacing:.01em;text-wrap:balance}
.sub{color:var(--muted);margin:4px 0 0}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:0;font-weight:700}
.demo{font-size:12px;background:var(--info-soft);color:var(--info);padding:3px 9px;border-radius:999px;font-weight:600;white-space:nowrap}

.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.kpi .l{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.kpi .v{font-family:var(--f-display);font-weight:800;font-size:32px;line-height:1.05;font-variant-numeric:tabular-nums}
.kpi .h{font-size:12.5px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel .ph{display:flex;justify-content:space-between;align-items:center;gap:8px}
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line);min-width:0}
.row:first-child{border-top:0}
.row .grow{flex:1;min-width:0}
.row .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.time{font-family:var(--f-mono);font-size:13px;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:3px 7px;flex:none}
.empty{color:var(--muted);font-size:14px;padding:8px 0}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.p-agendado{background:var(--info-soft);color:var(--info)}
.p-confirmado{background:var(--accent-soft);color:var(--warn)}
.p-concluido{background:var(--ok-soft);color:var(--ok)}
.p-faltou,.p-cancelado{background:var(--bad-soft);color:var(--bad)}
.p-ok{background:var(--ok-soft);color:var(--ok)}
.p-baixo{background:var(--warn-soft);color:var(--warn)}
.p-zerado{background:var(--bad-soft);color:var(--bad)}

.btn{border:1px solid var(--line);background:var(--surface);padding:9px 14px;border-radius:8px;font-weight:600;display:inline-flex;align-items:center;gap:6px;justify-content:center;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
a.btn{text-decoration:none;color:var(--ink)}
.row .s a,.cfoot a{color:var(--accent);font-weight:600}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.06)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.ghost{background:none;border-color:transparent}
.btn.danger{color:var(--bad)}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:6px 12px;border-radius:7px;font-weight:600;font-size:13.5px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}

/* Agenda */
.agtools{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.daylabel{font-weight:700;min-width:170px;text-align:center}
.agscroll{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.ag{display:grid;position:relative}
.ag .hd{position:sticky;top:0;background:var(--surface);z-index:3;padding:10px 8px;border-bottom:1px solid var(--line);font-weight:700;display:flex;align-items:center;gap:8px;min-width:0}
.ag .hd .dot{width:9px;height:9px;border-radius:50%;flex:none}
.ag .tm{font-family:var(--f-mono);font-size:12px;color:var(--muted);padding:4px 8px;border-top:1px dashed var(--line);text-align:right}
.ag .slot{border-top:1px dashed var(--line);border-left:1px solid var(--line);background:none;border-right:0;border-bottom:0;min-height:44px;padding:0;color:transparent;font-size:12px;font-weight:600}
.ag .slot:hover{background:var(--surface-2);color:var(--muted)}
.ag .slot.off{background:repeating-linear-gradient(135deg,transparent 0 6px,var(--surface-2) 6px 8px);cursor:default}
.ag .slot.off:hover{color:transparent}
.appt{margin:3px;border-radius:7px;padding:6px 8px;text-align:left;border:0;border-left:4px solid var(--c);background:var(--surface-2);z-index:2;display:flex;flex-direction:column;gap:1px;min-width:0;overflow:hidden}
.appt b{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.appt span{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.appt.st-concluido{opacity:.62}
.appt.st-faltou,.appt.st-cancelado{opacity:.5;text-decoration:line-through}
.now-line{position:absolute;left:0;right:0;height:2px;background:var(--bad);z-index:4;pointer-events:none}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}

/* Agendar (cliente) */
.book{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
.steps{display:flex;gap:6px;flex-wrap:wrap}
.steps span{font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.steps span.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.steps span.done{color:var(--ink)}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.opt{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:14px;text-align:left;display:flex;flex-direction:column;gap:3px}
.opt:hover{border-color:var(--accent)}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt b{font-size:15px}
.opt .pr{font-family:var(--f-display);font-weight:800;font-size:22px}
.opt small{color:var(--muted)}
.days{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.day{flex:none;width:68px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:0}
.day small{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.day b{font-family:var(--f-display);font-size:26px;font-weight:800;line-height:1.1}
.day[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.times{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:8px}
.times button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 0;font-family:var(--f-mono);font-size:14px}
.times button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.summary{position:sticky;top:20px}
.summary dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:14px}
.summary dt{color:var(--muted)}
.summary dd{margin:0;font-weight:600;text-align:right}
.total{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid var(--line);padding-top:10px}
.total b{font-family:var(--f-display);font-size:30px;font-weight:800}
.done-card{text-align:center;padding:28px 16px;display:flex;flex-direction:column;gap:10px;align-items:center}
.done-card .big{font-family:var(--f-display);font-weight:800;font-size:34px;text-transform:uppercase;line-height:1}

/* Tabelas */
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;font-weight:700;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--surface-2)}
.stamps{display:flex;gap:3px}
.stamps i{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--accent)}
.stamps i.f{background:var(--accent)}
.search{width:100%;max-width:340px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 12px}
.av{width:34px;height:34px;border-radius:50%;background:var(--accent-soft);color:var(--ink);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}

/* Gráfico */
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-family:var(--f-mono);font-size:10px}
.bars{display:flex;flex-direction:column;gap:10px}
.bar .bt{display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:4px}
.bar .bk{height:8px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.bar .bk i{display:block;height:100%;background:var(--accent);border-radius:4px}

/* Modal */
.ov{position:fixed;inset:0;background:rgba(10,14,20,.5);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--surface);border-radius:14px;width:100%;max-width:480px;max-height:calc(100% - 20px);overflow:auto;padding:20px;display:flex;flex-direction:column;gap:14px;border:1px solid var(--line)}
.modal h3{font-family:var(--f-display);font-weight:800;text-transform:uppercase;font-size:26px;margin:0;line-height:1}
.mh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.fld{display:flex;flex-direction:column;gap:5px}
.fld label{font-size:12.5px;font-weight:700;color:var(--muted)}
.fld input,.fld select{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:9px 11px;width:100%}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px;margin:0}
.kv dt{color:var(--muted)}.kv dd{margin:0;font-weight:600}
.msg{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:13.5px;white-space:pre-wrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:9px;font-weight:600;z-index:60;font-size:14px;max-width:calc(100% - 32px)}

/* Barra inferior (celular) */
.tabbar{display:none}
.who{display:flex;align-items:center;gap:8px;font-weight:600;font-size:13.5px;flex-wrap:wrap}
.who:empty{display:none}
body.client .side,body.client .tabbar,body.client .mtop,body.locked .side,body.locked .tabbar,body.locked .mtop{display:none!important}
body.client .app,body.locked .app{grid-template-columns:1fr}
body.client main,body.locked main{padding-bottom:40px}
.login{max-width:420px;margin:6vh auto 0;display:flex;flex-direction:column;gap:16px}
.chead{display:flex;flex-direction:column;gap:6px}
.chead .brand{font-size:24px;margin:0}
.chead .pole{margin:6px 0 10px}
.contact{margin-top:16px}
.plink{border:0;background:none;padding:0;font-weight:600;text-align:left;color:var(--ink)}
.plink span{color:var(--muted);font-size:12px}
.plink:hover{color:var(--accent)}
.fintabs{align-self:flex-start;max-width:100%;overflow-x:auto}
.pfnav{display:flex;gap:6px;align-items:center}
.pfnav select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 8px;font-weight:600}
.up{color:var(--ok);font-weight:700}.down{color:var(--bad);font-weight:700}
.colors{display:flex;gap:8px;flex-wrap:wrap}
.sw-c{width:32px;height:32px;border-radius:50%;position:relative;cursor:pointer;border:2px solid transparent}
.sw-c input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.sw-c:has(input:checked){border-color:var(--ink);box-shadow:inset 0 0 0 3px var(--surface)}
.sw-c:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.danger-zone{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:10px}
.pvbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:var(--accent);color:var(--accent-ink);padding:10px max(12px,env(safe-area-inset-right,0px)) 10px max(12px,env(safe-area-inset-left,0px));font-weight:700;font-size:14px}
.pvbar .btn{background:var(--ink);color:var(--bg);border-color:var(--ink)}
body.client .pvbar{border-radius:10px;margin-bottom:16px}
.cfoot{text-align:center;font-size:12.5px;margin:12px 0 0}
.cfoot a{color:var(--muted)}
.week{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.week h2{text-transform:capitalize}
@media (max-width:900px){.week{grid-template-columns:1fr}}
.tabbar{display:none}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{display:none}
  .mtop{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .mtop .brand{font-size:22px}
  .mtop .pole{margin:8px 0 0;width:100%}
  main{padding-bottom:calc(92px + env(safe-area-inset-bottom,0px));padding-top:16px}
  .tabbar{display:grid;grid-template-columns:repeat(6,1fr);position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);z-index:40;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
  .tabbar button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 7px;font-size:10.5px;font-weight:700;color:var(--muted);min-width:0}
  .tabbar button svg{width:22px;height:22px}
  .tabbar button[aria-current="page"]{color:var(--accent)}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid2,.book{grid-template-columns:1fr}
  .summary{position:static}
  .kpi .v{font-size:27px}
}
@media (max-width:420px){.frow{grid-template-columns:1fr}.hide-sm{display:none}}

/* ===== Site público (mesma página, modo "site") ===== */
body.site .app,body.site .tabbar{display:none!important}
body.site{background:#0e0d0b}
#site{--sbg:#0e0d0b;--sbg2:#16140f;--scard:#1d1a14;--sline:#2e2a21;--gold:#d4a24c;--gold2:#f0c977;--stext:#f3eee4;--smuted:#a59d8c;--green:#25d366;
  background:var(--sbg);color:var(--stext);font-family:var(--f-body);line-height:1.6;overflow-x:hidden;min-height:100vh}
#site a{color:inherit;text-decoration:none}
#site h1,#site h2.big,#site h3{font-family:var(--f-display);font-weight:800;text-transform:uppercase;letter-spacing:.01em;line-height:.95;margin:0;color:var(--stext)}
#site .sw{max-width:1120px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-left,0px))}

<script>
(function(){
const IC={
painel:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>',
agenda:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
agendar:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="6" cy="7" r="3"/><circle cx="6" cy="17" r="3"/><path d="M8.5 8.5 20 18M8.5 15.5 20 6"/></svg>',
clientes:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="9" cy="8" r="4"/><path d="M2 21c0-4 3-6 7-6s7 2 7 6M16 4a4 4 0 0 1 0 8M22 21c0-3-2-5-4-5.5"/></svg>',
financeiro:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 2v20M17 6H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>',
estoque:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/></svg>'};
IC.links='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>';
IC.links0='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M10 14a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/><path d="M14 10a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/></svg>';
const PAYS=['Pix','Dinheiro','Débito','Crédito'];
const IMG={logo:'../logo.webp'};
const STEP=30;
const DEF_HRS={0:null,1:null,2:['09:00','20:00'],3:['09:00','20:00'],4:['09:00','20:00'],5:['09:00','20:00'],6:['09:00','16:00']};
const DIAS=['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];

const brl=v=>v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const addDays=(s,n)=>{const d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return ymd(d)};
const toMin=t=>{const[h,m]=t.split(':').map(Number);return h*60+m};
const toT=m=>pad(Math.floor(m/60))+':'+pad(m%60);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const WD=['dom','seg','ter','qua','qui','sex','sáb'];
const fmtDay=s=>{const d=new Date(s+'T12:00:00');return d.toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'})};
const short=s=>{const d=new Date(s+'T12:00:00');return pad(d.getDate())+'/'+pad(d.getMonth()+1)};
const uid=()=>Math.random().toString(36).slice(2,9);
const initials=n=>n.split(' ').map(p=>p[0]).slice(0,2).join('').toUpperCase();
const TODAY=ymd(new Date());
const nowMin=()=>{const d=new Date();return d.getHours()*60+d.getMinutes()};
const isSunday=s=>new Date(s+'T12:00:00').getDay()===0;
const HR=()=>(typeof S!=='undefined'&&S&&S.hours)||DEF_HRS;
const dayH=s=>HR()[new Date(s+'T12:00:00').getDay()]||null;
const isClosed=s=>!dayH(s);
const OPENd=s=>toMin(dayH(s)[0]);
const CLOSEd=s=>toMin(dayH(s)[1])-STEP;
const hoursText=()=>{const H=HR(),g=[];let i=1;const ord=[1,2,3,4,5,6,0];
  for(let k=0;k<7;){const d=ord[k],v=H[d];let j=k;while(j+1<7&&JSON.stringify(H[ord[j+1]])===JSON.stringify(v))j++;
    if(v){const a=DIAS[d].slice(0,3).toLowerCase(),b=DIAS[ord[j]].slice(0,3).toLowerCase();g.push((j>k?a+' a '+b:DIAS[d].toLowerCase())+' '+v[0].replace(':00','h')+'–'+v[1].replace(':00','h'))}k=j+1}
  return g.join(' · ')||'Consulte'};

const igUrl=v=>{v=String(v||'').trim();if(!v)return'';if(/^https?:\/\//i.test(v))return v;if(/instagram\.com/i.test(v))return'https://'+v.replace(/^\/+/,'');return'https://instagram.com/'+v.replace(/^@/,'')};
const waUrl=v=>{v=String(v||'').trim();if(!v)return'';if(/^https?:\/\//i.test(v))return v;if(/wa\.me|whatsapp\.com/i.test(v))return'https://'+v.replace(/^\/+/,'');const d=v.replace(/\D/g,'');return d?'https://wa.me/'+(d.length<=11?'55'+d:d):''};
const DEF_INFO={insta:'https://instagram.com/barbeariadomaycao',whats:'https://wa.me/5547988229178',end:'R. Philipp Bauler, 1955 - Testo Salto, Blumenau - SC',slogan:'Degradê na régua, freestyle, barba alinhada e aquele papo bom.',sobre:'',nota:'5,0 ★',clientes:'5 mil+',desde:'2023'};
const CACHE='maycao-cache-v1';
let S; try{S=JSON.parse(localStorage.getItem(CACHE))}catch(e){S=null}
const HAD_CACHE=!!(S&&S.barbers);
if(!HAD_CACHE)S={barbers:[{id:'b1',name:'Maycão',slug:'maycao',color:'#A87622',comm:0}],services:[],info:{...DEF_INFO},hours:JSON.parse(JSON.stringify(DEF_HRS))};
['clients','appts','products','tx','payouts'].forEach(k=>{if(!Array.isArray(S[k]))S[k]=[]});
if(!S.info)S.info={...DEF_INFO};
if(!S.hours)S.hours=JSON.parse(JSON.stringify(DEF_HRS));
function weekStart(d){const x=new Date(d+'T12:00:00');return addDays(d,-((x.getDay()+6)%7))}
const CUR_WK=weekStart(TODAY);
function wkInfo(b,wk){const end=addDays(wk,6);const ap=S.appts.filter(a=>a.barberId===b.id&&a.date>=wk&&a.date<=end);
  const done=ap.filter(a=>a.status==='concluido');const fut=ap.filter(a=>a.status==='agendado'||a.status==='confirmado');
  const fat=done.reduce((s,a)=>s+a.price,0);const earned=fat*b.comm/100;const forecast=fut.reduce((s,a)=>s+a.price,0)*b.comm/100;
  const pay=(S.payouts||[]).filter(p=>p.barberId===b.id&&p.week===wk);const paid=pay.reduce((s,p)=>s+p.value,0);
  return{n:done.length,fat,earned,forecast,paid,pay,due:Math.max(0,+(earned-paid).toFixed(2))}}
const cache=()=>{try{localStorage.setItem(CACHE,JSON.stringify(S))}catch(e){}};
const save=()=>{cache();agendarSync()};

const ACT=()=>S.barbers.filter(b=>!b.off);
const B=id=>S.barbers.find(x=>x.id===id), SV=id=>S.services.find(x=>x.id===id), C=id=>S.clients.find(x=>x.id===id);
const live=a=>a.status!=='cancelado'&&a.status!=='faltou';
let OCC=[];
function busy(barberId,date,start,dur,ignoreId){
  const L=mode==='client'?OCC:S.appts;
  return L.some(a=>a.id!==ignoreId&&a.barberId===barberId&&a.date===date&&live(a)&&toMin(a.time)<start+dur&&start<toMin(a.time)+(a.dur||(SV(a.serviceId)||{dur:30}).dur));
}
function freeTimes(barberId,date,dur,ignoreId){
  const out=[]; if(isClosed(date))return out;
  const OPEN=OPENd(date),CLOSE=CLOSEd(date);
  for(let t=OPEN;t+dur<=CLOSE+STEP;t+=STEP){ if(date===TODAY&&t<=nowMin())continue; if(!busy(barberId,date,t,dur,ignoreId))out.push(toT(t)); }
  return out;
}
function clientStats(id){
  const done=S.appts.filter(a=>a.clientId===id&&a.status==='concluido').sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time));
  const spent=done.reduce((s,a)=>s+a.price,0);
  const last=done[0]?.date||null;
  const days=last?Math.round((new Date(TODAY)-new Date(last))/864e5):null;
  const next=S.appts.filter(a=>a.clientId===id&&(a.status==='agendado'||a.status==='confirmado')&&a.date>=TODAY).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time))[0];
  return {done,visits:done.length,spent,last,days,next};
}

/* ---------- Acesso e navegação ---------- */
const APP_URL=location.origin+location.pathname.replace(/index\.html$/,'');
const SITE_URL=new URL('../',location.href).href;
let user=null; try{user=sessionStorage.getItem('maycao-user')}catch(e){}
if(user&&!ACT().some(b=>b.id===user))user=null;
const isDono=()=>user==='b1';
const visBarbers=()=>isDono()?ACT():ACT().filter(b=>b.id===user);
function menu(){return isDono()?[['painel','Painel'],['agenda','Agenda'],['clientes','Clientes'],['financeiro','Financeiro'],['estoque','Estoque'],['links','Ajustes']]:[['painel','Painel'],['agenda','Minha agenda'],['financeiro','Meus ganhos']]}
let view='painel', mode='admin';
function route(){
  let h='';try{h=location.hash.slice(1)}catch(e){}
  if(h==='site'){location.href=SITE_URL;return}
  if(/^s-/.test(h)&&mode==='site')return
  if(/^agendar/.test(h)){mode='client';const slug=h.split('-')[1];const b=slug&&ACT().find(x=>x.slug===slug);
    if(!W.step||W.step===4||W.slug!==slug){W={step:b?1:0,barberId:b?b.id:null,lock:!!b,slug}}}
  else{mode='admin';if(menu().some(v=>v[0]===h))view=h}
}
function nav(){
  const html=menu().map(([k,l])=>`<button data-a="go" data-v="${k}" ${view===k?'aria-current="page"':''}>${IC[k]}<span>${l}</span></button>`).join('');

function painelBarbeiro(){
  const me=B(user);
  const mine=S.appts.filter(a=>a.barberId===user);
  const today=mine.filter(a=>a.date===TODAY&&live(a));
  const done=today.filter(a=>a.status==='concluido');
  const monthStart=TODAY.slice(0,8)+'01';
  const monthDone=mine.filter(a=>a.status==='concluido'&&a.date>=monthStart);
  const fatM=monthDone.reduce((s,a)=>s+a.price,0);
  const weekEnd=addDays(TODAY,6);

function agendarSync(){if(!SB||!SESSION||!READY)return;clearTimeout(syncT);syncT=setTimeout(flush,250)}
async function flush(){
  if(!SB||!SESSION||!READY)return;
  if(syncing){agendarSync();return}syncing=true;
  try{
    const up=[],seen=new Set();
    COLS.forEach(c=>S[c].forEach(it=>{if(!it||!it.id)return;const k=c+'|'+it.id;seen.add(k);const j=JSON.stringify(it);if(SNAP[k]!==j)up.push({c,id:String(it.id),it,k,j})}));
    const del=Object.keys(SNAP).filter(k=>!seen.has(k));
    for(let i=0;i<up.length;i+=300){const part=up.slice(i,i+300);const now=new Date().toISOString();
      const {error}=await SB.from('registros').upsert(part.map(x=>({colecao:x.c,id:x.id,dados:x.it,atualizado:now})),{onConflict:'colecao,id'});if(error)throw error;part.forEach(x=>SNAP[x.k]=x.j)}
    const byCol={};del.forEach(k=>{const i=k.indexOf('|');(byCol[k.slice(0,i)]=byCol[k.slice(0,i)]||[]).push(k.slice(i+1))});
    for(const c in byCol){const {error}=await SB.from('registros').delete().eq('colecao',c).in('id',byCol[c]);if(error)throw error;byCol[c].forEach(id=>delete SNAP[c+'|'+id])}
    const ck=cfgKey();
    if(ck!==CFGSNAP&&isDono()&&donoPin){
      const {data,error}=await SB.rpc('salvar_config',{p_pin_dono:donoPin,p_publica:pubCfg(),p_privada:privCfg()});if(error)throw error;
      if(data===false){toast('A senha do Maycão não confere. Entre de novo.');user=null;setDonoPin(null);await loadCfg();render()}
      else{CFGSNAP=ck;const st=await SB.rpc('equipe_status');if(!st.error)applyCfg(pubCfg(),privCfg(),st.data)}
    }
    setOnline(true);
  }catch(e){console.warn('sync',e);setOnline(false);clearTimeout(syncT);syncT=setTimeout(flush,8000)}
  finally{syncing=false}
}
function listen(){
  if(chan)return;
  chan=SB.channel('maycao-'+uid())
   .on('postgres_changes',{event:'*',schema:'public',table:'registros'},p=>{
     const r=(p.new&&p.new.colecao)?p.new:p.old;if(!r||!S[r.colecao])return;
     const k=r.colecao+'|'+r.id,arr=S[r.colecao],i=arr.findIndex(x=>x.id===r.id);
     if(p.eventType==='DELETE'){if(!(k in SNAP)&&i<0)return;if(i>=0)arr.splice(i,1);delete SNAP[k]}
     else{const j=JSON.stringify(p.new.dados);if(SNAP[k]===j)return;SNAP[k]=j;if(i>=0)arr[i]=p.new.dados;else arr.push(p.new.dados)}
     cache();rr();
   })
   .on('postgres_changes',{event:'*',schema:'public',table:'config_publica'},()=>{loadCfg().then(()=>{cache();rr()}).catch(()=>{})})
   .on('postgres_changes',{event:'*',schema:'public',table:'config_privada'},()=>{loadCfg().then(()=>{cache();rr()}).catch(()=>{})})
   .subscribe();
}

function pfRange(o){if(o.type==='semana')return[o.wk,addDays(o.wk,6)];if(o.type==='ano')return[o.y+'-01-01',o.y+'-12-31'];const last=new Date(o.y,o.m+1,0).getDate();return[`${o.y}-${pad(o.m+1)}-01`,`${o.y}-${pad(o.m+1)}-${pad(last)}`]}
function pfShift(o,d){const n={...o};if(o.type==='semana')n.wk=addDays(o.wk,7*d);else if(o.type==='ano')n.y+=d;else{let m=o.m+d,y=o.y;while(m<0){m+=12;y--}while(m>11){m-=12;y++}n.m=m;n.y=y}return n}

const pfLabel=o=>o.type==='semana'?`${short(o.wk)} a ${short(addDays(o.wk,6))}`:o.type==='ano'?String(o.y):`${MESES[o.m]} de ${o.y}`;

function barSvg(labels,vals,hi,fmt){const top=Math.max(100,Math.ceil(Math.max(...vals)/500)*500);const n=vals.length,Wd=640,H=200,L=44,Bt=24,T=10,bw=(Wd-L-8)/n,y=v=>T+(H-T-Bt)*(1-v/top);
  let g=`<svg viewBox="0 0 ${Wd} ${H}" role="img" aria-label="Faturamento no período">`;for(let k=0;k<=4;k++){const v=top*k/4;g+=`<line x1="${L}" x2="${Wd-4}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-6}" y="${y(v)+3}" text-anchor="end">${v>=1000?(v/1000).toLocaleString('pt-BR')+'k':v}</text>`}

function financeiro(){
  if(!isDono())return meusGanhos();
  if(finTab==='perf')return performance();
  if(finTab==='com')return comissoes();
  const from=per==='hoje'?TODAY:per==='semana'?addDays(TODAY,-6):TODAY.slice(0,8)+'01';
  const txs=S.tx.filter(t=>t.date>=from&&t.date<=TODAY);
  const inn=txs.filter(t=>t.type==='in').reduce((s,t)=>s+t.value,0);
  const out=txs.filter(t=>t.type==='out').reduce((s,t)=>s+t.value,0);
  const done=S.appts.filter(a=>a.status==='concluido'&&a.date>=from&&a.date<=TODAY);
  const comm=S.barbers.filter(b=>!b.off||done.some(a=>a.barberId===b.id)).map(b=>{const d=done.filter(a=>a.barberId===b.id);const v=d.reduce((s,a)=>s+a.price,0);return{b,n:d.length,v,c:v*b.comm/100}});

  const byPay=PAYS.map(p=>({p,v:txs.filter(t=>t.type==='in'&&t.method===p).reduce((s,t)=>s+t.value,0)}));
  const maxP=Math.max(1,...byPay.map(x=>x.v));
  const prod=txs.filter(t=>t.type==='in'&&t.cat==='Produto').reduce((s,t)=>s+t.value,0);
  // gráfico 14 dias
  const days=[];for(let i=13;i>=0;i--)days.push(addDays(TODAY,-i));
  const vals=days.map(d=>S.tx.filter(t=>t.date===d&&t.type==='in').reduce((s,t)=>s+t.value,0));
  const top=Math.max(100,Math.ceil(Math.max(...vals)/500)*500);

  const fat=done.reduce((s,a)=>s+a.price,0), com=fat*me.comm/100;
  const faltas=S.appts.filter(a=>a.barberId===user&&a.status==='faltou'&&a.date>=from&&a.date<=TODAY).length;
  const days=[];for(let i=13;i>=0;i--)days.push(addDays(TODAY,-i));

  const top=Math.max(50,Math.ceil(Math.max(...vals)/100)*100);

  for(let k=0;k<=4;k++){const v=top*k/4;svg+=`<line x1="${L}" x2="${Wd-4}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-6}" y="${y(v)+3}" text-anchor="end">${Math.round(v)}</text>`}
  vals.forEach((v,i)=>{const x=L+4+i*bw;svg+=`<rect x="${x+3}" y="${y(v)}" width="${bw-6}" height="${Math.max(0,H-Bt-y(v))}" rx="3" fill="${me.color}" opacity="${days[i]===TODAY?1:.6}"><title>${short(days[i])}: ${brl(v)}</title></rect>${i%2===0||days[i]===TODAY?`<text x="${x+bw/2}" y="${H-8}" text-anchor="middle">${isSunday(days[i])?'dom':short(days[i])}</text>`:''}`});

  </div>
  ${(()=>{const L=wkInfo(me,addDays(CUR_WK,-7)),Cw=wkInfo(me,CUR_WK),N=wkInfo(me,addDays(CUR_WK,7));return `<section class="panel"><h2>Minha comissão por semana</h2><div class="list">
    <div class="row"><div class="grow"><div class="t">Semana passada</div><div class="s">${short(addDays(CUR_WK,-7))} a ${short(addDays(CUR_WK,-2))}</div></div><b class="num">${brl(L.earned)}</b>${L.earned?(L.due>0?'<span class="pill p-zerado">A receber</span>':'<span class="pill p-ok">Recebido</span>'):''}</div>
    <div class="row"><div class="grow"><div class="t">Esta semana</div><div class="s">até agora · + ${brl(Cw.forecast)} pelos horários marcados</div></div><b class="num">${brl(Cw.earned)}</b><span class="pill p-confirmado">Acumulando</span></div>
    <div class="row"><div class="grow"><div class="t">Semana que vem</div><div class="s">previsão pelos horários marcados</div></div><b class="num">${brl(N.forecast)}</b></div></div></section>`})()}
  <section class="panel chart"><div class="ph"><h2>Comissão por dia</h2><span class="sub" style="margin:0;font-size:12px">últimos 14 dias</span></div>${svg}</section>
  <section class="panel" style="padding:12px 6px"><h2 style="padding:0 10px">Meus atendimentos</h2><div class="tbl"><table><thead><tr><th>Data</th><th>Cliente</th><th class="r">Valor</th><th class="r">Comissão</th></tr></thead><tbody>

   <td class="r"><div class="btns" style="justify-content:flex-end;flex-wrap:nowrap">${p.price?`<button class="btn sm" data-a="sell" data-id="${p.id}" ${p.qty?'':'disabled'}>Vender</button>`:`<button class="btn sm" data-a="use" data-id="${p.id}" ${p.qty?'':'disabled'}>Usar</button>`}<button class="btn sm" data-a="restock" data-id="${p.id}">Repor</button><button class="btn sm hide-sm" data-a="prod-edit" data-id="${p.id}">Editar</button></div></td></tr>`}).join('')}

document.addEventListener('click',e=>{
  if(e.target===ov){closeM();return}
  const el=e.target.closest('[data-a]');if(!el)return;
  const a=el.dataset.a,id=el.dataset.id;
  const P=id&&S.products.find(p=>p.id===id);
  switch(a){
    case 'go':view=el.dataset.v;closeM();try{history.replaceState(null,'','#'+view)}catch(err){}render();window.scrollTo({top:0});break;
    case 'close':closeM();break;
    case 'install':if(instEvt){instEvt.prompt();instEvt=null;render()}break;
    case 'device-out':deviceSignOut();break;
    case 'day':{const d=+el.dataset.d;agDate=d===0?TODAY:addDays(agDate,d*(agView==='semana'?7:1));render();break}
    case 'agview':agView=el.dataset.m;render();break;
    case 'pick-login':loginB=id;render();setTimeout(()=>{const p=document.getElementById('pin');p&&p.focus()},0);break;
    case 'logout':user=null;loginB=null;tempPin=null;setDonoPin(null);try{sessionStorage.removeItem('maycao-user')}catch(err){}view='painel';closeM();render();break;
    case 'preview':preview=true;if(el.dataset.t==='site')mode='site';else enterClient(el.dataset.t);render();window.scrollTo({top:0});break;
    case 'exit-preview':preview=false;mode='admin';view='links';render();window.scrollTo({top:0});break;
    case 'team-new':if(isDono())teamModal();break;
    case 'team-edit':if(isDono())teamModal(id);break;
    case 'team-reset':{const b=B(id);SB.rpc('resetar_pin',{p_pin_dono:donoPin,p_barber:b.id}).then(({data,error})=>{if(error||!data){toast(error?'Sem internet. Tente de novo.':'Não deu para resetar. Entre de novo como Maycão.');return}b.mustChange=true;cache();closeM();render();toast('Senha de '+b.name+' voltou para 123')});break}
    case 'team-del':{const b=B(id);const fut=S.appts.filter(a=>a.barberId===b.id&&a.date>=TODAY&&(a.status==='agendado'||a.status==='confirmado'));const box=md.querySelector('#delconf');
      box.innerHTML=`<div class="msg" style="display:flex;flex-direction:column;gap:10px"><span>${fut.length?`${esc(b.name)} tem ${fut.length} horário${fut.length>1?'s':''} marcado${fut.length>1?'s':''}. Ao excluir, ${fut.length>1?'eles serão cancelados':'ele será cancelado'}. Avise os clientes ou remarque antes.`:`Excluir ${esc(b.name)} da equipe?`}</span><div class="btns"><button class="btn sm danger" data-a="team-del-ok" data-id="${b.id}">Sim, excluir</button><button class="btn sm" data-a="close">Cancelar</button></div></div>`;break}
    case 'team-del-ok':{const b=B(id);S.appts.filter(a=>a.barberId===b.id&&a.date>=TODAY&&(a.status==='agendado'||a.status==='confirmado')).forEach(a=>{a.status='cancelado';syncAppt(a)});b.off=true;save();syncCfg();closeM();render();toast(b.name+' saiu da equipe');break}
    case 'my-pass':formModal('Trocar minha senha',[{k:'a',l:'Senha atual',type:'password'},{k:'n1',l:'Nova senha (4 a 6 números)',type:'password'},{k:'n2',l:'Repita a nova senha',type:'password'}],'Salvar',o=>{const me=B(user);const bad=t=>{toast(t)};if(!/^\d{4,6}$/.test(o.n1))return bad('Use de 4 a 6 números');if(o.n1==='123')return bad('Escolha uma senha diferente de 123');if(o.n1!==o.n2)return bad('As senhas não batem');
      SB.rpc('trocar_pin',{p_barber:me.id,p_atual:o.a,p_novo:o.n1}).then(({data,error})=>{if(error)return bad('Sem internet. Tente de novo.');if(!data)return bad('Senha atual errada');if(isDono())setDonoPin(o.n1);me.mustChange=false;cache();closeM();toast('Senha trocada')})});break;
    case 'copy-link':{const u=el.dataset.t==='site'?SITE_URL:APP_URL+'#'+el.dataset.t;const row=el.closest('.row').querySelector('.linktxt');const fb=()=>{const r=document.createRange();r.selectNodeContents(row);const sel=getSelection();sel.removeAllRanges();sel.addRange(r);toast('Link selecionado, copie com o teclado')};try{navigator.clipboard.writeText(u).then(()=>toast('Link copiado'),fb)}catch(err){fb()}break}
    case 'svc-edit':{const sv=SV(id);formModal('Editar '+esc(sv.name),[{k:'name',l:'Nome',v:sv.name,req:1},{k:'price',l:'Preço (R$)',type:'number',v:sv.price,req:1},{k:'dur',l:'Duração',opts:['30','60','90']}],'Salvar',o=>{sv.name=o.name;sv.price=Math.max(0,o.price||0);sv.dur=+o.dur;save();syncCfg();closeM();render();toast('Atualizado no site de agendamento')});const d=md.querySelector('#g_dur');if(d)d.value=String(sv.dur);break}
    case 'info-edit':formModal('Contato e textos do site',[{k:'insta',l:'Link do Instagram',v:igUrl(S.info.insta)},{k:'whats',l:'Link do WhatsApp',v:waUrl(S.info.whats)},{k:'end',l:'Endereço',v:S.info.end},{k:'slogan',l:'Frase do topo do site',v:S.info.slogan||''},{k:'sobre',l:'Texto do "Quem somos"',v:S.info.sobre||''},{k:'nota',l:'Nota no Google',v:S.info.nota||''},{k:'clientes',l:'Clientes atendidos (ex.: 5 mil+)',v:S.info.clientes||''},{k:'desde',l:'Aberta desde (ano)',v:S.info.desde||''}],'Salvar',o=>{o.insta=igUrl(o.insta);o.whats=waUrl(o.whats);Object.assign(S.info,o);save();syncCfg();closeM();render();toast('Atualizado no site de agendamento')});break;
    case 'svc-new':formModal('Novo serviço',[{k:'name',l:'Nome',req:1},{k:'price',l:'Preço (R$)',type:'number',req:1},{k:'dur',l:'Duração',opts:['30','60','90']}],'Adicionar',o=>{S.services.push({id:'s'+uid(),name:o.name,price:Math.max(0,o.price||0),dur:+o.dur});save();syncCfg();closeM();render();toast('Serviço já aparece no agendamento')});break;
    case 'svc-del':{const used=S.appts.some(x=>x.serviceId===id&&(x.status==='agendado'||x.status==='confirmado'));if(used){toast('Tem horário marcado com esse serviço. Remarque antes de remover.');break}S.services=S.services.filter(x=>x.id!==id);S.appts=S.appts.filter(x=>x.serviceId!==id||x.status!=='cancelado');save();syncCfg();render();toast('Serviço removido do site');break}
    case 'hours-save':{const nh={};document.querySelectorAll('#hrsform .hrow').forEach(r=>{const d=+r.dataset.d,on=r.querySelector('.hopen').checked,o=r.querySelector('.ho').value,c=r.querySelector('.hc').value;nh[d]=on&&o&&c&&toMin(c)>toMin(o)?[o,c]:null});S.hours=nh;save();syncCfg();render();toast('Horários atualizados no site');break}
    case 'appt':apptModal(id);break;
    case 'new':newApptModal({barberId:el.dataset.b,time:el.dataset.t,date:agDate});break;
    case 'new-for':newApptModal({clientId:id,date:TODAY});break;
    case 'edit-appt':newApptModal({id});break;
    case 'status':{const ap=S.appts.find(x=>x.id===id);ap.status=el.dataset.s;save();syncAppt(ap);closeM();render();toast(stLabel(el.dataset.s));break}
    case 'finish':{const ap=S.appts.find(x=>x.id===id),pay=md.querySelector('#pay').value;ap.status='concluido';ap.pay=pay;
      S.tx.push({id:uid(),date:TODAY,type:'in',cat:'Serviço',desc:SV(ap.serviceId).name+' · '+C(ap.clientId).name.split(' ')[0],value:ap.price,method:pay,barberId:ap.barberId,apptId:ap.id});
      save();syncAppt(ap);closeM();render();const v=clientStats(ap.clientId).visits;toast(v%10===0?'Concluído · cliente ganhou um corte grátis!':'Concluído · '+brl(ap.price)+' no caixa');break}
    case 'copy':{const t=md.querySelector('#wamsg');const fallback=()=>{const r=document.createRange();r.selectNodeContents(t);const s=getSelection();s.removeAllRanges();s.addRange(r);toast('Mensagem selecionada, copie com o teclado')};
      try{navigator.clipboard.writeText(t.textContent).then(()=>toast('Mensagem copiada'),fallback)}catch(err){fallback()}break}
    case 'client':clientModal(id);break;
    case 'new-client':formModal('Novo cliente',[{k:'name',l:'Nome',req:1},{k:'phone',l:'WhatsApp',req:1},{k:'birth',l:'Aniversário (dd/mm)'}],'Cadastrar',o=>{S.clients.push({id:'c'+uid(),name:o.name,phone:o.phone,birth:o.birth||'—'});save();closeM();render();toast('Cliente cadastrado')});break;
    case 'wa-back':case 'wa-bday':{const c=C(id);const m=a==='wa-bday'?`Parabéns, ${c.name.split(' ')[0]}! 🎉 Presente da Barbearia do Maycão: 20% de desconto no corte essa semana.`:`E aí, ${c.name.split(' ')[0]}! Faz tempo que tu não aparece. Bora dar um tapa no visual? Tem horário essa semana 💈`;
      openM(mh(a==='wa-bday'?'Mandar parabéns':'Chamar de volta',esc(c.name))+`<div class="msg" id="wamsg">${esc(m)}</div><div class="btns"><button class="btn" data-a="copy">Copiar</button><a class="btn pri" target="_blank" rel="noopener" href="https://wa.me/55${c.phone.replace(/\D/g,'')}?text=${encodeURIComponent(m)}">Abrir WhatsApp</a></div>`);break}
    case 'per':per=el.dataset.p;render();break;
    case 'fintab':finTab=el.dataset.t;render();window.scrollTo({top:0});break;
    case 'pf-type':PF.type=el.dataset.t;render();break;
    case 'pf-nav':PF=pfShift(PF,+el.dataset.d);render();break;
    case 'cw-nav':{const d=+el.dataset.d;comWk=d===0?CUR_WK:addDays(comWk,7*d);render();break}
    case 'pay':{const b=B(id),w=wkInfo(b,comWk);if(w.due<=0)break;S.payouts.push({id:uid(),barberId:b.id,week:comWk,value:w.due,date:TODAY});save();render();toast(`${brl(w.due)} pago para ${b.name}`);break}
    case 'pay-undo':{const b=B(id);S.payouts=S.payouts.filter(p=>!(p.barberId===b.id&&p.week===comWk));save();render();toast('Pagamento desfeito');break}
    case 'expense':formModal('Lançar despesa',[{k:'desc',l:'Descrição',req:1},{k:'value',l:'Valor (R$)',type:'number',req:1},{k:'cat',l:'Categoria',opts:['Aluguel','Contas','Produtos','Insumos','Manutenção','Outros']},{k:'method',l:'Pago com',opts:PAYS}],'Lançar',o=>{if(!(o.value>0))return;S.tx.push({id:uid(),date:TODAY,type:'out',...o});save();closeM();render();toast('Despesa lançada')});break;
    case 'comm':{const b=B(id);formModal('Comissão de '+esc(b.name),[{k:'comm',l:'Percentual sobre serviços (%)',type:'number',v:b.comm,req:1}],'Salvar',o=>{b.comm=Math.max(0,Math.min(100,o.comm||0));save();syncCfg();closeM();render();toast('Comissão atualizada')});break}
    case 'sell':formModal('Vender '+esc(P.name),[{k:'qty',l:`Quantidade (tem ${P.qty})`,type:'number',v:1,req:1},{k:'method',l:'Pagamento',opts:PAYS}],'Registrar venda',o=>{const n=Math.max(1,Math.min(P.qty,Math.floor(o.qty)));P.qty-=n;for(let i=0;i<n;i++)S.tx.push({id:uid(),date:TODAY,type:'in',cat:'Produto',desc:P.name,value:P.price,method:o.method});save();closeM();render();toast(`Venda registrada · ${brl(P.price*n)}`)});break;
    case 'use':P.qty=Math.max(0,P.qty-1);save();render();toast('Baixa de 1 unidade');break;
    case 'restock':formModal('Repor '+esc(P.name),[{k:'qty',l:'Quantidade que chegou',type:'number',v:Math.max(1,P.min*2-P.qty),req:1},{k:'cost',l:'Custo por unidade (R$)',type:'number',v:P.cost,req:1}],'Dar entrada',o=>{const n=Math.max(1,Math.floor(o.qty));P.qty+=n;P.cost=o.cost||P.cost;S.tx.push({id:uid(),date:TODAY,type:'out',cat:'Produtos',desc:'Reposição · '+P.name,value:+(n*P.cost).toFixed(2),method:'Pix'});save();closeM();render();toast(`+${n} no estoque`)});break;
    case 'prod-edit':{const pr=P;const cats=['Finalizador','Barba','Cabelo','Bar','Uso interno'];if(!cats.includes(pr.cat))cats.push(pr.cat);
      formModal('Editar produto',[{k:'name',l:'Nome',v:pr.name,req:1},{k:'cat',l:'Categoria',opts:cats},{k:'qty',l:'Quantidade em estoque (contagem atual)',type:'number',v:pr.qty},{k:'min',l:'Estoque mínimo (avisa quando chegar nele)',type:'number',v:pr.min},{k:'cost',l:'Custo (R$)',type:'number',v:pr.cost},{k:'price',l:'Preço de venda (R$, 0 se uso interno)',type:'number',v:pr.price}],'Salvar',o=>{
        if(!o.name)return;const before=pr.qty;Object.assign(pr,{name:o.name,cat:o.cat,qty:Math.max(0,Math.floor(o.qty||0)),min:Math.max(0,Math.floor(o.min||0)),cost:Math.max(0,o.cost||0),price:Math.max(0,o.price||0)});save();closeM();render();toast(pr.qty!==before?`Estoque ajustado: ${before} → ${pr.qty}`:'Produto atualizado')});
      md.querySelector('#g_cat').value=pr.cat;
      md.insertAdjacentHTML('beforeend',`<div class="danger-zone"><div class="row" style="border:0;padding:0"><div class="grow"><div class="t">Excluir produto</div><div class="s">Some do estoque. As vendas antigas continuam no financeiro.</div></div><button class="btn sm danger" data-a="prod-del" data-id="${pr.id}">Excluir</button></div><div id="pdelconf"></div></div>`);break}
    case 'prod-del':md.querySelector('#pdelconf').innerHTML=`<div class="msg" style="display:flex;flex-direction:column;gap:10px"><span>Excluir ${esc(P.name)}${P.qty?` com ${P.qty} em estoque`:''}?</span><div class="btns"><button class="btn sm danger" data-a="prod-del-ok" data-id="${P.id}">Sim, excluir</button><button class="btn sm" data-a="close">Cancelar</button></div></div>`;break;
    case 'prod-del-ok':{const n=P.name;S.products=S.products.filter(x=>x.id!==P.id);save();closeM();render();toast(n+' excluído');break}
    case 'new-prod':formModal('Novo produto',[{k:'name',l:'Nome',req:1},{k:'cat',l:'Categoria',opts:['Finalizador','Barba','Cabelo','Bar','Uso interno']},{k:'qty',l:'Quantidade',type:'number',v:0},{k:'min',l:'Estoque mínimo',type:'number',v:3},{k:'cost',l:'Custo (R$)',type:'number',v:0},{k:'price',l:'Preço de venda (R$, 0 se uso interno)',type:'number',v:0}],'Cadastrar',o=>{S.products.push({id:'p'+uid(),...o});save();closeM();render();toast('Produto cadastrado')});break;
    case 'w-svc':W.serviceId=id;W.step=2;W.time=null;render();window.scrollTo({top:0});break;
    case 'w-bar':W.barberId=id;W.step=1;W.time=null;render();window.scrollTo({top:0});break;
    case 'w-day':W.date=el.dataset.d;W.time=null;render();break;
    case 'w-time':W.time=el.dataset.t;render();break;
    case 'w-next':W.step=3;render();break;
    case 'w-back':W.step=Math.max(W.lock?1:0,W.step-1);render();break;
    case 'w-reset':W={step:W.lock?1:0,barberId:W.lock?W.barberId:null,lock:W.lock,slug:W.slug};render();break;
  }
});
document.addEventListener('submit',e=>{
  if(e.target.id==='pform'){e.preventDefault();const a=document.getElementById('np1').value.trim(),c=document.getElementById('np2').value.trim(),er=document.getElementById('perr');
    const fail=t=>{er.textContent=t;er.hidden=false};if(!/^\d{4,6}$/.test(a))return fail('Use de 4 a 6 números.');if(a==='123')return fail('Escolha uma senha diferente da padrão.');if(a!==c)return fail('As duas senhas não batem.');
    const me=B(user);const btn=e.target.querySelector('button[type=submit]');btn.disabled=true;
    SB.rpc('trocar_pin',{p_barber:me.id,p_atual:tempPin||'123',p_novo:a}).then(({data,error})=>{btn.disabled=false;if(error)return fail('Sem internet. Tente de novo.');if(!data)return fail('Não deu certo. Saia e entre de novo com 123.');
      if(isDono())setDonoPin(a);tempPin=null;me.mustChange=false;cache();document.body.classList.remove('locked');view='painel';render();toast('Senha criada. Bem-vindo, '+me.name)});return}
  if(e.target.id==='dform'){e.preventDefault();const em=document.getElementById('d_email').value.trim(),pw=document.getElementById('d_pass').value,er=document.getElementById('derr'),bt=document.getElementById('dsend');
    bt.disabled=true;bt.textContent='Entrando…';
    SB.auth.signInWithPassword({email:em,password:pw}).then(async({data,error})=>{
      if(error){bt.disabled=false;bt.textContent='Entrar';er.textContent=/fetch|network/i.test(error.message||'')?'Sem internet. Tente de novo.':'E-mail ou senha errados.';er.hidden=false;return}
      const ok=await SB.rpc('eh_equipe');
      if(!ok.error&&ok.data===false){await SB.auth.signOut();SESSION=null;render();const e2=document.getElementById('derr');if(e2){e2.textContent='Esse e-mail não é da barbearia. Use o login da Barbearia do Maycão.';e2.hidden=false}return}
      SESSION=data.session;render();
      try{await loadAll();listen()}catch(err){console.warn(err);setOnline(false)}
      render()});return}
  if(e.target.id==='lform'){e.preventDefault();const pin=document.getElementById('pin').value.trim(),le=document.getElementById('lerr'),bt=e.target.querySelector('button[type=submit]');bt.disabled=true;
    SB.rpc('entrar_pin',{p_barber:loginB,p_pin:pin}).then(({data,error})=>{bt.disabled=false;
      if(error||data==='errado'||data==='bloqueado'){le.textContent=error?'Sem internet. Tente de novo.':data==='bloqueado'?'Muitas tentativas erradas. Espere 10 minutos.':'PIN errado. Tente de novo.';le.hidden=false;document.getElementById('pin').value='';return}
      user=loginB;try{sessionStorage.setItem('maycao-user',user)}catch(err){}
      if(user==='b1')setDonoPin(pin);
      if(data==='trocar'){tempPin=pin;B(user).mustChange=true}else{B(user).mustChange=false}
      view='painel';render();if(data!=='trocar')toast('Bem-vindo, '+B(user).name)});return}
  if(e.target.id!=='wform')return;e.preventDefault();
  W.name=document.getElementById('wname').value.trim();W.phone=document.getElementById('wphone').value.trim();
  const we=document.getElementById('werr'),ws=document.getElementById('wsend');const fail=t=>{we.textContent=t;we.hidden=false};
  if(W.name.length<2)return fail('Coloque seu nome.');
  if(W.phone.replace(/\D/g,'').length<10)return fail('Coloque seu WhatsApp com DDD.');
  if(!SB)return fail('Agendamento indisponível no momento. Chama a gente no WhatsApp.');
  ws.disabled=true;ws.textContent='Agendando…';
  SB.rpc('agendar',{p_barber:W.barberId,p_servico:W.serviceId,p_data:W.date,p_hora:W.time,p_nome:W.name,p_fone:W.phone}).then(async({data,error})=>{
    ws.disabled=false;ws.textContent='Confirmar agendamento';
    if(error)return fail('Sem internet. Tente de novo.');
    if(data&&data.erro){
      if(data.erro==='ocupado'||data.erro==='data'||data.erro==='fora_do_horario'||data.erro==='fechado'){await loadOcupados();W.step=2;W.time=null;render();window.scrollTo({top:0});toast('Esse horário acabou de ser ocupado. Escolha outro.');return}
      if(data.erro==='telefone')return fail('Confira seu WhatsApp com DDD.');
      if(data.erro==='nome')return fail('Coloque seu nome.');
      return fail('Não deu para agendar. Chama a gente no WhatsApp.');}
    W={step:4,done:{name:W.name,serviceId:W.serviceId,barberId:data.barberId,date:W.date,time:W.time},lock:W.lock,slug:W.slug,barberId:W.lock?W.barberId:null};
    await loadOcupados();if(READY){try{await loadAll()}catch(e){}}render();window.scrollTo({top:0})});
});
document.addEventListener('input',e=>{if(e.target.id==='wname')W.name=e.target.value;if(e.target.id==='wphone')W.phone=e.target.value;if(e.target.id==='q'){q=e.target.value.toLowerCase().trim();const pos=e.target.selectionStart;render();const n=document.getElementById('q');n.focus();try{n.setSelectionRange(pos,pos)}catch(err){}}});
document.addEventListener('change',e=>{if(e.target.id==='pf_m'){PF.m=+e.target.value;render();return}if(e.target.id==='pf_y'){PF.y=+e.target.value;render();return}if(e.target.classList&&e.target.classList.contains('hopen')){const r=e.target.closest('.hrow');r.querySelectorAll('input[type=time]').forEach(i=>i.disabled=!e.target.checked)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!ov.hidden)closeM()});
route();render();
(async()=>{
  if('serviceWorker' in navigator){try{navigator.serviceWorker.register('sw.js')}catch(e){}}
  if(!SB){render();return}
  try{const {data}=await SB.auth.getSession();SESSION=data.session}catch(e){SESSION=null}
  SB.auth.onAuthStateChange((ev,s)=>{SESSION=s;if(ev==='SIGNED_OUT'){READY=false;render()}});
  try{await loadPublic()}catch(e){}
  if(mode==='client')route();
  await loadOcupados();
  render();
  if(SESSION){const ok=await SB.rpc('eh_equipe').catch(()=>({}));if(ok&&ok.data===false){await SB.auth.signOut();SESSION=null;render();return}
    try{await loadAll();listen()}catch(e){console.warn(e);setOnline(false)}render()}
})();
setInterval(()=>{if(mode==='client'&&SB){loadOcupados().then(()=>{if(W.step<3)rr()})}},60000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&SB&&SESSION&&READY){flush().then(()=>loadAll()).then(()=>rr()).catch(()=>{})}});
window.addEventListener('online',()=>{if(SESSION&&READY)flush()});
})();
</script>


</body></html>
